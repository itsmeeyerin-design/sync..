<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sync 설치 중</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background: #f8dbe3;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #222;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 34px;
      transform: translateY(-10px);
    }

    .app-icon {
      width: 122px;
      height: 122px;
      border-radius: 32px;
      object-fit: cover;
      box-shadow: 0 14px 28px rgba(210, 90, 110, 0.22);
    }

    .app-name {
      margin-top: 26px;
      font-size: 42px;
      font-weight: 750;
      letter-spacing: -1px;
    }

    .progress-bg {
      width: 100%;
      height: 20px;
      margin-top: 56px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.7);
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff668d, #ff8aa5);
      animation: install 7s forwards;
    }

    .percent {
      margin-top: 24px;
      font-size: 32px;
      font-weight: 800;
      color: #f16d8b;
    }

    .status {
      margin-top: 12px;
      font-size: 23px;
      font-weight: 650;
      letter-spacing: -0.5px;
    }

    .notice {
      margin-top: 48px;
      width: 88%;
      min-height: 62px;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(220, 120, 140, 0.12);
    }

    .check {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ff7191;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .notice span {
      font-size: 14px;
      color: #333;
      white-space: nowrap;
    }

    @keyframes install {
      0% { width: 0%; }
      25% { width: 25%; }
      50% { width: 52%; }
      70% { width: 68%; }
      100% { width: 100%; }
    }

    @media (max-height: 700px) {
      .wrap {
        transform: translateY(0);
        padding: 18px 34px;
      }

      .app-icon {
        width: 105px;
        height: 105px;
      }

      .app-name {
        margin-top: 18px;
        font-size: 36px;
      }

      .progress-bg {
        margin-top: 40px;
      }

      .notice {
        margin-top: 34px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <img class="app-icon" src="sync.png" alt="Sync app icon">

    <div class="app-name">Sync</div>

    <div class="progress-bg">
      <div class="progress-bar" id="bar"></div>
    </div>

    <div class="percent" id="percent">0%</div>
    <div class="status" id="status">앱 설치 중...</div>

    <div class="notice">
      <div class="check">✓</div>
      <span>설치가 완료되면 자동으로 실행됩니다.</span>
    </div>
  </div>

  <script>
    const percent = document.getElementById("percent");
    const status = document.getElementById("status");

    let num = 0;

    const timer = setInterval(() => {
      if (num < 100) {
        num++;
        percent.textContent = num + "%";
      } else {
        clearInterval(timer);
        status.textContent = "설치 완료";
      }
    }, 70);
  </script>
</body>
</html>
