<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매칭 중...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
}

body{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    overflow:hidden;
}

/* 로딩 화면 */
.loading-screen{
    text-align:center;
}

.heart{
    font-size:70px;
    animation:pulse 1.3s infinite;
}

.loading-text{
    margin-top:20px;
    font-size:28px;
    font-weight:600;
}

.dots::after{
    content:"";
    animation:dots 1.5s infinite;
}

@keyframes dots{
    0%{content:"";}
    25%{content:".";}
    50%{content:"..";}
    75%{content:"...";}
    100%{content:"";}
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
}

/* 매칭 완료 */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:.4s;
}

.overlay.show{
    opacity:1;
}

.popup{
    background:white;
    padding:28px 40px;
    border-radius:30px;
    font-size:34px;
    font-weight:500;
    transform:scale(.8);
    transition:.4s;
}

.overlay.show .popup{
    transform:scale(1);
}
</style>
</head>

<body>

<div class="loading-screen">
    <div class="heart">💜</div>
    <div class="loading-text">
        매칭 중<span class="dots"></span>
    </div>
</div>

<div class="overlay" id="overlay">
    <div class="popup">
        매칭되었습니다! 💜
    </div>
</div>

<script>
setTimeout(() => {
    document.getElementById("overlay").classList.add("show");
}, 5000);
</script>

</body>
</html>
