<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync 설치</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    background:#f7dce3;
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    max-width:430px;
    text-align:center;
    padding:40px;
}

/* 앱 아이콘 */
.app-icon{
    width:110px;
    height:110px;
    margin:0 auto;
}

.app-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:30px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

/* 앱 이름 */
.app-name{
    margin-top:28px;
    font-size:42px;
    font-weight:700;
    color:#222;
}

/* 프로그레스 */
.progress-wrap{
    width:100%;
    margin-top:70px;
}

.progress-bg{
    width:100%;
    height:18px;
    background:#f3ebee;
    border-radius:999px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.6);
}

.progress-bar{
    width:0%;
    height:100%;
    border-radius:999px;
    background:linear-gradient(
        90deg,
        #ff7b98,
        #ff92aa
    );
}

.percent{
    margin-top:28px;
    font-size:30px;
    font-weight:700;
    color:#ff7998;
}

.status{
    margin-top:16px;
    font-size:22px;
    font-weight:600;
    color:#222;
}

/* 하단 안내 */
.notice{
    margin-top:70px;
    background:rgba(255,255,255,.45);
    backdrop-filter:blur(8px);
    border-radius:20px;
    padding:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
}

.icon{
    width:34px;
    height:34px;
    background:#ff7b98;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.notice-text{
    font-size:15px;
    color:#444;
}

</style>
</head>

<body>

<div class="container">

    <!-- 아이콘 -->
    <div class="app-icon">
        <img src="sync.png">
    </div>

    <!-- 앱 이름 -->
    <div class="app-name">Sync</div>

    <!-- 프로그레스 -->
    <div class="progress-wrap">

        <div class="progress-bg">
            <div class="progress-bar" id="bar"></div>
        </div>

        <div class="percent" id="percent">0%</div>

        <div class="status" id="status">
            앱 설치 중...
        </div>

    </div>

    <!-- 안내 -->
    <div class="notice">
        <div class="icon">✓</div>
        <div class="notice-text">
            설치가 완료되면 자동으로 실행됩니다.
        </div>
    </div>

</div>

<script>

let progress = 0;

const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const status = document.getElementById("status");

const install = setInterval(() => {

    progress++;

    bar.style.width = progress + "%";
    percent.innerText = progress + "%";

    if(progress >= 100){

        clearInterval(install);

        status.innerText = "설치 완료";
        percent.innerText = "100%";

    }

}, 60);

</script>

</body>
</html>
