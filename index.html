<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sync 설치 중</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background: #f8dbe3;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #222;
      overflow: hidden;
    }

    .box {
      width: 86%;
      max-width: 360px;
      text-align: center;
      transform: translateY(10px);
    }

    .app-icon {
      width: 108px;
      height: 108px;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 12px 26px rgba(210, 90, 110, 0.22);
    }

    h1 {
      margin: 12px 0 0;
      font-size: 36px;
      font-weight: 750;
      letter-spacing: -1px;
      color: #222;
    }

    .bar-wrap {
      margin-top: 42px;
      width: 100%;
      height: 18px;
      background: rgba(255, 255, 255, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff668d, #ff8aa5);
      animation: install 7s forwards;
    }

    .percent {
      margin-top: 22px;
      font-size: 30px;
      font-weight: 800;
      color: #f16d8b;
    }

    .status {
      margin-top: 10px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.5px;
      color: #222;
    }

    .dots::after {
      content: "";
      animation: dots 1.2s infinite;
      color: #f16d8b;
    }

    .notice {
      margin: 34px auto 0;
      width: 92%;
      min-height: 58px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      box-shadow: 0 8px 20px rgba(220, 120, 140, 0.12);
    }

    .check {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ff7191;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 19px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .notice span {
      font-size: 14px;
      color: #333;
      white-space: nowrap;
    }

    @keyframes install {
      0% { width: 0%; }
      25% { width: 28%; }
      50% { width: 53%; }
      70% { width: 68%; }
      100% { width: 100%; }
    }

    @keyframes dots {
      0% { content: ""; }
      33% { content: "."; }
      66% { content: ".."; }
      100% { content: "..."; }
    }

    @media (max-height: 700px) {
      .box {
        transform: translateY(0);
      }

      .app-icon {
        width: 96px;
        height: 96px;
        border-radius: 25px;
      }

      h1 {
        font-size: 32px;
        margin-top: 10px;
      }

      .bar-wrap {
        margin-top: 32px;
      }

      .percent {
        margin-top: 18px;
        font-size: 27px;
      }

      .status {
        font-size: 20px;
      }

      .notice {
        margin-top: 26px;
        min-height: 54px;
      }

      .notice span {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="box">
    <img class="app-icon" src="sync.png" alt="Sync app icon">

    <h1>Sync</h1>

    <div class="bar-wrap">
      <div class="bar"></div>
    </div>

    <div class="percent" id="percent">0%</div>

    <div class="status" id="status">
      앱 설치 중<span class="dots"></span>
    </div>

    <div class="notice">
      <div class="check">✓</div>
      <span>설치가 완료되면 자동으로 실행됩니다.</span>
    </div>
  </div>

  <script>
    let number = 0;
    const percent = document.getElementById("percent");
    const status = document.getElementById("status");

    const timer = setInterval(() => {
      if (number < 100) {
        number++;
        percent.textContent = number + "%";
      } else {
        clearInterval(timer);
        status.textContent = "설치 완료";
      }
    }, 40);
  </script>
</body>
</html>
